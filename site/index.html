<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>GPT-2 in Racket</title>
    <meta
      name="description"
      content="Abdullah and Amaar wrote a GPT-2 small inference engine in pure Racket. How it reads the weights, runs twelve transformer blocks, caches keys and values, and splits the math across cores."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script>
      // Paint the right background before the page loads: their saved pick,
      // else the device's light/dark setting.
      try {
        var t = sessionStorage.getItem('portfolio-theme');
        var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (d) {
          document.documentElement.style.background = '#121210';
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; background: #faf9f7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

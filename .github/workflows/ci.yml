name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: raco test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "9.3"

      - name: Cache pinned GPT-2 files
        uses: actions/cache@v4
        with:
          path: models/gpt2
          key: gpt2-assets-${{ hashFiles('tools/gpt2-assets.sha256') }}

      - name: Fetch pinned GPT-2 files
        run: sh tools/fetch-gpt2-vocab.sh

      - name: Run tests
        run: raco test .

      - name: CLI help
        run: |
          racket main.rkt --help >help.txt
          grep -q generate help.txt
          rm -f help.txt

      - name: Missing model assets
        run: |
          set +e
          racket main.rkt generate --model-dir models/missing-gpt2 --prompt "Once upon a time" --max-new-tokens 16 >stdout.txt 2>stderr.txt
          code=$?
          set -e
          test "$code" -ne 0
          grep -q "missing model assets" stderr.txt
          test ! -s stdout.txt
          cat stderr.txt
          rm -f stdout.txt stderr.txt

      - name: Benchmark harness
        run: |
          racket bench/harness.rkt >bench-out.txt
          grep -q "^racket-version: " bench-out.txt
          grep -q "^vm: chez-scheme$" bench-out.txt
          grep -q "^prompt-length: 16$" bench-out.txt
          grep -q "^prompt-length: 128$" bench-out.txt
          grep -q "^matmul-dim: 768$" bench-out.txt
          grep -q "^matmul-gflops: " bench-out.txt
          rm -f bench-out.txt

      - name: Racket sources do not reference fixtures or Python
        run: |
          if grep -R -n -E -i --include='*.rkt' 'tools/fixtures|python' .; then
            echo "Racket sources must not name the fixture tree or Python"
            exit 1
          fi
